# 每個 PR 與推到 main 時跑型別檢查與測試
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一個 PR 有新的 push 時，取消舊的執行
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # package.json 要求 Node >= 22.18（直接執行 .ts、node:sqlite）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
